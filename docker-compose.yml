version: '3.9'
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - OPENAI_API_KEY
      - OPENAI_MODEL=gpt-4o-mini
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://server:8787
    depends_on:
      - server